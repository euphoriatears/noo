<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>NOCTERA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#0f0f10;
    overflow-x:hidden;
    font-family:'Inter',sans-serif;
    color:white;
}

/* GRAIN */

body::before{
    content:'';
    position:fixed;
    inset:0;

    background-image:url('https://www.transparenttextures.com/patterns/asfalt-light.png');

    opacity:0.04;

    pointer-events:none;

    z-index:9999;
}

/* AMBIENT */

.ambient{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-2;
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.12;
    animation:move 18s infinite alternate ease-in-out;
}

.blob1{
    width:500px;
    height:500px;
    background:#ffffff;
    top:-10%;
    left:-10%;
}

.blob2{
    width:600px;
    height:600px;
    background:#8f8f8f;
    bottom:-20%;
    right:-10%;
    animation-delay:5s;
}

@keyframes move{
    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(80px,-40px) scale(1.1);
    }
}

/* SPOTLIGHT */

.spotlight{
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top,
    rgba(255,255,255,0.08),
    transparent 35%);

    pointer-events:none;
    z-index:-1;
}

/* HERO */

.hero{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    padding:40px 20px;
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:60px;

    animation:fadeUp 1.2s ease;
}

.logo h1{
    font-size:72px;
    font-weight:900;
    letter-spacing:18px;
}

.logo p{
    margin-top:15px;
    font-size:12px;
    letter-spacing:8px;
    color:rgba(255,255,255,0.4);
}

/* CARD */

.card{
    position:relative;

    width:100%;
    max-width:430px;

    padding:25px;

    border-radius:42px;

    background:rgba(255,255,255,0.04);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    overflow:hidden;

    box-shadow:
    0 0 120px rgba(0,0,0,0.8);

    transition:0.6s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(255,255,255,0.16);
}

/* CARD LIGHT */

.card::before{
    content:'';

    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at top,
    rgba(255,255,255,0.08),
    transparent 50%);
    pointer-events:none;
}

/* PRODUCT */

.product{
    position:relative;

    height:430px;

    border-radius:30px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(to bottom,
    #1a1a1c,
    #0f0f10);

    border:1px solid rgba(255,255,255,0.08);
}

.product img{
    width:260px;

    border-radius:28px;

    animation:float 6s ease-in-out infinite;

    opacity:1;
    
    transition:0.3s;

    box-shadow:
    0 25px 100px rgba(0,0,0,0.9);
}

.card:hover .product img{
    transform:scale(1.03) rotate(1deg);
}


/* TELEGRAM ACCENT */
    
.telegram-btn{
    position:relative;
    overflow:hidden;
}

.telegram-btn::before{
    content:'';

    position:absolute;

    top:0;
    left:-120%;

    width:120%;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.9),
        transparent
    );

    animation:telegramGlow 3s linear infinite;
}

@keyframes telegramGlow{

    0%{
        left:-120%;
    }

    100%{
        left:120%;
    }

}
    
/* INFO */

.info{
    text-align:center;
    margin-top:30px;
}

.info h2{
    font-size:28px;
    letter-spacing:4px;
}

.info p{
    margin-top:14px;

    color:rgba(255,255,255,0.4);

    letter-spacing:4px;

    font-size:11px;
}

/* COLORS */

.section-title{
    text-align:center;

    margin-top:35px;
    margin-bottom:18px;

    font-size:11px;
    letter-spacing:5px;

    color:rgba(255,255,255,0.35);
}

.colors{
    display:flex;
    justify-content:center;
    gap:12px;
}

.color{
    width:28px;
    height:28px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,0.18);

    cursor:pointer;

    transition:0.3s;
}

.color:hover{
    transform:scale(1.12);
}

/* SIZES */

.sizes{
    display:flex;
    justify-content:center;
    gap:12px;
}

.size{
    padding:14px 20px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,0.08);

    background:rgba(255,255,255,0.04);

    color:white;

    backdrop-filter:blur(20px);

    cursor:pointer;

    transition:0.3s;

    letter-spacing:3px;
}

.size:hover{
    transform:translateY(-4px);

    border-color:rgba(255,255,255,0.24);

    background:rgba(255,255,255,0.08);
}

/* PRICE */

.price{
    text-align:center;

    margin-top:35px;

    font-size:36px;
    font-weight:900;

    letter-spacing:3px;
}

/* BUTTON */

.btn{
    display:flex;
    justify-content:center;

    margin-top:40px;
}

.btn a{
    text-decoration:none;

    padding:18px 42px;

    border-radius:999px;

    border:1px solid rgba(255,255,255,0.12);

    background:rgba(255,255,255,0.05);

    color:white;

    letter-spacing:5px;
    font-size:12px;

    backdrop-filter:blur(20px);

    transition:0.4s;
}

.btn a:hover{
    transform:translateY(-4px);

    background:rgba(255,255,255,0.08);

    border-color:rgba(255,255,255,0.3);

    box-shadow:
    0 0 40px rgba(255,255,255,0.08);
}

/* ORDER SECTION */

.order{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:80px 20px;
}

.order-box{
    width:100%;
    max-width:1100px;

    padding:60px;

    border-radius:42px;

    background:rgba(255,255,255,0.03);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);
}

.order-title{
    text-align:center;
}

.order-title h2{
    font-size:52px;
    font-weight:900;
    letter-spacing:8px;
}

.order-title p{
    margin-top:18px;

    color:rgba(255,255,255,0.4);

    letter-spacing:5px;

    font-size:12px;
}

/* CONTACTS */

.contacts{
    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:20px;

    margin-top:50px;
}

.contact{
    padding:26px;

    border-radius:28px;

    border:1px solid rgba(255,255,255,0.08);

    background:rgba(255,255,255,0.04);

    text-align:center;

    letter-spacing:5px;

    transition:0.4s;

    cursor:pointer;
}

.contact:hover{
    transform:translateY(-4px);

    background:rgba(255,255,255,0.08);

    border-color:rgba(255,255,255,0.24);
}

/* FORM */

.form{
    margin-top:60px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:20px;
}

.form input,
.form textarea{
    padding:22px;

    border:none;
    outline:none;

    border-radius:22px;

    background:rgba(255,255,255,0.04);

    border:1px solid rgba(255,255,255,0.08);

    color:white;

    font-size:14px;

    backdrop-filter:blur(20px);
}

.form textarea{
    grid-column:1/3;

    min-height:180px;

    resize:none;
}

.form input::placeholder,
.form textarea::placeholder{
    color:rgba(255,255,255,0.25);

    letter-spacing:3px;
}

/* SUBMIT */

.submit{
    display:flex;
    justify-content:center;

    margin-top:40px;
}

.submit button{
    padding:18px 44px;

    border:none;

    border-radius:999px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.12);

    color:white;

    letter-spacing:5px;

    cursor:pointer;

    transition:0.4s;
}


.active-size{
    background:white !important;
    color:black !important;
}
    
.submit button:hover{
    transform:translateY(-4px);

    background:rgba(255,255,255,0.08);

    border-color:rgba(255,255,255,0.3);
}

/* ANIMATIONS */

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-14px);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:768px){

    .logo h1{
        font-size:42px;
        letter-spacing:10px;
    }

    .contacts{
        grid-template-columns:1fr;
    }

    .form{
        grid-template-columns:1fr;
    }

    .form textarea{
        grid-column:auto;
    }

    .order-box{
        padding:35px 22px;
    }

    .order-title h2{
        font-size:34px;
    }

}

</style>
</head>

<body>

<!-- AMBIENT -->

<div class="ambient">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
</div>

<div class="spotlight"></div>

<!-- HERO -->

<section class="hero">

    <div class="logo">
        <h1>NOCTERA</h1>
        <p>PREMIUM STREETWEAR</p>
    </div>

    <div class="card">

        <div class="product">
            <img 
               id="productImage"
               src="assets/black.jpg"
            >
        </div>

        <div class="info">
            <h2>NOCTERA BOX TEE</h2>
            <p>HEAVYWEIGHT / BOXY FIT / CROPPED</p>
        </div>

        <div class="section-title">
            COLORS
        </div>

<div class="colors">

    <div 
        class="color"
        style="background:#0f0f10;"
        onclick="changeShirt('assets/black.jpg', 'Black')"
    ></div>

    <div 
        class="color"
        style="background:#2f2f2f;"
        onclick="changeShirt('assets/gray.jpg', 'Gray')"
    ></div>

    <div 
        class="color"
        style="background:#d8d8d8;"
        onclick="changeShirt('assets/white.jpg', 'White')"
    ></div>

    <div 
        class="color"
        style="background:#9c8c7d;"
        onclick="changeShirt('assets/beige.jpg', 'Beige')"
    ></div>

    <div 
        class="color"
        style="background:#c7b2a3;"
        onclick="changeShirt('assets/pink.jpg', 'Pink')"
    ></div>

</div>

        <div class="section-title">
            SIZE
        </div>

        <div class="sizes">

            <button class="size">S</button>
            <button class="size">M</button>
            <button class="size">L</button>
            <button class="size">XL</button>

        </div>

        <div class="price">
            ₴1490
        </div>

        <div class="btn">
            <a href="#order">
                ORDER NOW
            </a>
        </div>

    </div>

</section>

<!-- ORDER -->

<section class="order" id="order">

    <div class="order-box">

        <div class="order-title">
            <h2>ORDER ACCESS</h2>
            <p>CONTACT OR LEAVE A REQUEST</p>
        </div>

         <div class="contacts">

          <div class="contact telegram-btn" onclick="openTelegram()">
                TELEGRAM
        </div>

        <div class="contact" onclick="openViber()">
             VIBER
          </div>

</div> 

        <div class="form">

            <input type="text" placeholder="NAME">

            <input type="text" placeholder="TELEGRAM / PHONE">

            <textarea placeholder="COMMENT"></textarea>

        </div>

        <div class="submit">
            <button>
                SEND REQUEST
            </button>
        </div>

    </div>

</section>
<script>

let selectedColor = 'Black'
let selectedSize = 'S'

/* IMAGE CHANGE */

function changeShirt(image, color){

    const shirt = document.getElementById('productImage')

    selectedColor = color

    shirt.style.opacity = '0'

    setTimeout(() => {

        shirt.src = image

        shirt.style.opacity = '1'

    }, 200)

}

/* SIZE */

const sizeButtons = document.querySelectorAll('.size')

sizeButtons.forEach(button => {

    button.addEventListener('click', () => {

        sizeButtons.forEach(btn => {
            btn.classList.remove('active-size')
        })

        button.classList.add('active-size')

        selectedSize = button.innerText

    })

})

/* СООБЩЕНИЕ */

function createMessage(){

    return encodeURIComponent(
`NOCTERA ORDER

Color: ${selectedColor}
Size: ${selectedSize}`
    )

}

/* TELEGRAM */

function openTelegram(){

    const message = createMessage()

    window.open(
        `https://t.me/crsdcrcle?text=${message}`,
        '_blank'
    )

}

/* VIBER */

function openViber(){

    window.open(
        'https://invite.viber.com/?g=FPEyOLI7lFagC1nX_WhP6L867HHbH22g',
        '_blank'
    )

}

</script>
</body>
</html>
